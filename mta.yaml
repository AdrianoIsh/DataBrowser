_schema-version: 3.3.0
ID: DataBrowser
description: A simple CAP project.
version: 1.0.0
modules:
- name: DataBrowser-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: DataBrowser-auth
  - name: DataBrowser-db
  - name: DataBrowser-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: DataBrowser-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: DataBrowser-db
  parameters:
    buildpack: nodejs_buildpack
- name: DataBrowser-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: DataBrowser-auth
  - name: srv-api
  - name: DataBrowser-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - comdatabrowsermonitorproject1.zip
      name: comdatabrowsermonitorproject1
      target-path: app/
    - artifacts:
      - comdatabrowserusuariosmonitorproject2.zip
      name: comdatabrowserusuariosmonitorproject2
      target-path: app/
- name: comdatabrowsermonitorproject1
  type: html5
  path: app/project1
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: DataBrowser-destinations
  type: com.sap.application.content
  requires:
  - name: DataBrowser-auth
    parameters:
      service-key:
        name: DataBrowser-auth-key
  - name: DataBrowser-html5-repo-host
    parameters:
      service-key:
        name: DataBrowser-html5-repo-host-key
  - name: srv-api
  - name: DataBrowser-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: DataBrowser-html5-repository
          ServiceInstanceName: DataBrowser-html5-repo-host
          ServiceKeyName: DataBrowser-html5-repo-host-key
          sap.cloud.service: DataBrowser.v2
        - Authentication: OAuth2UserTokenExchange
          Name: DataBrowser-auth
          ServiceInstanceName: DataBrowser-auth
          ServiceKeyName: DataBrowser-auth-key
        - Authentication: OAuth2UserTokenExchange
          Name: srv-api
          TokenServiceInstanceName: DataBrowser-auth
          TokenServiceKeyName: DataBrowser-auth-key
          URL: ~{srv-api/srv-url}
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: comdatabrowserusuariosmonitorproject2
  type: html5
  path: app/project2
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: DataBrowser-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: DataBrowser-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: DataBrowser-db
  type: com.sap.xs.hdi-container
  parameters:
    config:
      schema: MONITOR_HDI
    service: hana
    service-plan: hdi-shared
- name: DataBrowser-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: DataBrowser-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
